<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17191b">
  <title>Kill Team Scorecard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    :root {
      --ink: #f4f1eb;
      --muted: #a8a9a5;
      --faint: #64686a;
      --canvas: #17191b;
      --panel: #212427;
      --panel-alt: #292d30;
      --line: #414648;
      --line-strong: #62686a;
      --orange: #ed5d27;
      --orange-hot: #ff7540;
      --orange-dark: #923717;
      --tac-op-security: #142f5c;
      --tac-op-seek-and-destroy: #5b1c24;
      --tac-op-recon: #704018;
      --tac-op-infiltration: #292d30;
      --left: #ed5d27;
      --right: #e5e2d9;
      --shadow: rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; touch-action: manipulation; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(237, 93, 39, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(237, 93, 39, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 42px 42px;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: '';
      opacity: 0.17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; padding: 16px 28px; }
    .app-header { display: flex; align-items: end; max-width: 1560px; margin: 0 auto 22px; }
    .eyebrow { margin: 0 0 5px; color: var(--orange); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.025em; }
    h1 { font-size: clamp(34px, 4vw, 58px); line-height: 0.92; font-weight: 800; }
    .scorecard { max-width: 1560px; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); background: rgba(33, 36, 39, 0.91); box-shadow: 0 18px 45px var(--shadow); }
    .topline { display: grid; grid-template-columns: minmax(0, 1fr) 320px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    .team-panel { display: grid; gap: 10px; padding: 18px 22px 20px; }
    .team-panel.right { text-align: right; }
    .team-panel select + select { margin-top: 0; }
    select { width: 100%; min-height: 48px; border: 1px solid var(--line-strong); border-radius: 0; padding: 0 42px 0 14px; color: var(--ink); background-color: var(--panel-alt); appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--orange) 50%), linear-gradient(135deg, var(--orange) 50%, transparent 50%); background-position: calc(100% - 19px) 21px, calc(100% - 13px) 21px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; outline: none; }
    select:focus { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(237, 93, 39, 0.2); }
    .operatives-hidden { visibility: hidden; }
    option[data-archetype='Security'] { background-color: var(--tac-op-security); }
    option[data-archetype='Seek and Destroy'] { background-color: var(--tac-op-seek-and-destroy); }
    option[data-archetype='Recon'] { background-color: var(--tac-op-recon); }
    option[data-archetype='Infiltration'] { background-color: var(--tac-op-infiltration); }
    .team-panel.right select { text-align: right; }
    .turning-point { display: grid; place-items: center; align-content: center; gap: 7px; padding: 13px 8px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: rgba(23, 25, 27, 0.48); }
    .section-kicker { color: var(--muted); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
    .counter { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; gap: 12px; }
    .counter .icon-button:first-child { justify-self: end; }
    .counter .icon-button:last-child { justify-self: start; }
    .counter-value { min-width: 38px; color: var(--orange-hot); font-family: 'Barlow Condensed', sans-serif; font-size: 54px; line-height: 0.8; font-weight: 700; text-align: center; }
    .icon-button { width: 47px; height: 47px; border: 1px solid var(--line-strong); color: var(--ink); background: var(--panel-alt); font-size: 24px; line-height: 1; transition: border-color 140ms, color 140ms, background 140ms, transform 140ms; }
    .icon-button:hover, .icon-button:focus-visible { border-color: var(--orange); color: var(--orange-hot); background: #303438; outline: none; }
    .icon-button:active { transform: translateY(1px); }
    .initiative { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; margin-top: 8px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .initiative button:first-child { justify-self: end; }
    .initiative button:last-child { justify-self: start; }
    .initiative button { width: 34px; height: 34px; border: 1px solid transparent; color: var(--faint); background: transparent; font-size: 29px; line-height: 1; }
    .initiative button.active { color: var(--orange-hot); }
    .initiative button:focus-visible { outline: 1px solid var(--orange); outline-offset: 3px; }

    .scores { display: grid; grid-template-columns: minmax(0, 1fr) 320px minmax(0, 1fr); }
    .cp-scores { display: grid; grid-template-columns: minmax(0, 1fr) 320px minmax(0, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .cp-side { display: flex; align-items: center; justify-content: flex-end; min-height: 74px; padding: 9px 22px; }
    .cp-side.right { justify-content: flex-start; text-align: right; }
    .cp-center { display: flex; align-items: center; justify-content: center; gap: 18px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); color: var(--orange); font-family: 'Barlow Condensed', sans-serif; font-size: 25px; letter-spacing: 0.12em; }
    .center-score { color: var(--orange-hot); font-size: 45px; line-height: 1; }
    .score-side { padding: 16px 22px 22px; }
    .score-side.right { text-align: right; }
    .score-side .score-stepper { justify-content: flex-end; }
    .score-side.right .score-stepper { justify-content: flex-start; }
    .score-rows { display: grid; gap: 9px; }
    .score-row { display: flex; align-items: center; min-height: 58px; padding: 7px 13px; }
    .plain-score-row { justify-content: flex-end; }
    .score-side.right .plain-score-row { justify-content: flex-start; }
    .score-stepper { display: flex; align-items: center; gap: 10px; }
    .score-number { min-width: 42px; color: var(--orange-hot); font-family: 'Barlow Condensed', sans-serif; font-size: 45px; line-height: 1; text-align: center; }
    .score-buttons { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); background: rgba(41, 45, 48, 0.7); }
    .score-buttons .icon-button { width: 44px; height: 44px; font-size: 23px; }
    .side-control { display: flex; align-items: center; gap: 10px; }
    .side-control.right { flex-direction: row-reverse; }
    .side-control.right .score-buttons { flex-direction: row-reverse; }
    .side-control .icon-button { width: 34px; height: 34px; font-size: 18px; }
    .row-labels { display: grid; align-content: center; gap: 9px; padding: 16px 10px 22px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: rgba(23, 25, 27, 0.38); }
    .row-label { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 58px; color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-align: center; }
    .row-label strong { display: block; color: var(--orange); font-family: 'Barlow Condensed', sans-serif; font-size: 25px; letter-spacing: 0.12em; }
    .killed-note { display: flex; align-items: baseline; gap: 5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.04em; white-space: nowrap; }
    .killed-count { color: var(--orange-hot); font-family: 'Barlow Condensed', sans-serif; font-size: 35px; line-height: 1; }
    .kill-control { display: flex; align-items: center; gap: 10px; }
    .kill-control.right { flex-direction: row-reverse; }
    .primary-operation[aria-hidden='true'] { opacity: 0.45; }
    .center-rail { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .totals { display: grid; grid-template-columns: minmax(0, 1fr) 320px minmax(0, 1fr); border-top: 1px solid var(--line); background: #1b1e20; }
    .total-side { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 17px 22px 19px; }
    .total-side.right { flex-direction: row-reverse; }
    .total-side.winner { background: rgba(237, 93, 39, 0.2); box-shadow: inset 0 0 0 1px var(--orange); }
    .total-value.winner { color: #fff0e9; text-shadow: 0 0 18px rgba(237, 93, 39, 0.85); }
    .total-label { color: var(--muted); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .total-value { color: var(--orange-hot); font-family: 'Barlow Condensed', sans-serif; font-size: 45px; line-height: 0.8; }
    .total-center { display: grid; place-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); color: var(--orange); font-family: 'Barlow Condensed', sans-serif; font-size: 25px; letter-spacing: 0.12em; text-align: center; }
    .action-buttons { display: flex; gap: 8px; }
    .helper { color: var(--faint); font-size: 9px; letter-spacing: 0.06em; }
    .reset-button { border: 1px solid var(--line-strong); padding: 10px 15px; color: var(--muted); background: transparent; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
    .reset-button:hover, .reset-button:focus-visible { border-color: var(--orange); color: var(--orange-hot); outline: none; }
    footer { max-width: 1560px; margin: 22px auto 0; color: var(--faint); font-size: 9px; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
    footer span { color: var(--orange); }
    .error-message { display: none; max-width: 1560px; margin: 10px auto 0; padding: 12px 14px; border: 1px solid var(--orange-dark); color: #ffb199; background: rgba(146, 55, 23, 0.22); font-size: 11px; }
    .error-message.visible { display: block; }

    .score-layout { --layout-columns: minmax(0, 1.5fr) 56px minmax(85px, .85fr) minmax(70px, .75fr) minmax(118px, 1fr) minmax(70px, .75fr) minmax(85px, .85fr) 56px minmax(0, 1.5fr); }
    .setup-grid, .layout-row { display: grid; grid-template-columns: var(--layout-columns); align-items: center; }
    .setup-grid { grid-template-rows: 96px 55px 65px; gap: 10px 0; padding: 10px 22px 5px; border-bottom: 1px solid var(--line); }
    .setup-grid select { min-width: 0; }
    .team-left { grid-area: 1 / 1 / 2 / 4; }
    .team-right { grid-area: 1 / 7 / 2 / 10; text-align: right; }
    .operatives-left { grid-area: 2 / 1 / 3 / 4; }
    .operatives-right { grid-area: 2 / 7 / 3 / 10; text-align: right; }
    .operatives-left, .operatives-right { transform: translateY(-6px); }
    .initiative-left { grid-area: 1 / 4; justify-self: end; }
    .initiative-label { grid-area: 1 / 5; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-align: center; text-transform: uppercase; }
    .initiative-right { grid-area: 1 / 6; justify-self: start; }
    .turning-label { grid-area: 2 / 4 / 3 / 7; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-align: center; text-transform: uppercase; }
    .turning-minus { grid-area: 3 / 4; justify-self: end; }
    .turning-value { grid-area: 3 / 5; justify-self: center; }
    .turning-plus { grid-area: 3 / 6; justify-self: start; }
    .turning-plus.end-battle { font-size: 9px; letter-spacing: 0.08em; }
    .modifier-controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; grid-row: 3; align-self: stretch; }
    .modifier-controls-left { grid-column: 1 / 4; }
    .modifier-controls-right { grid-column: 7 / 10; }
    .modifier-control { display: grid; grid-template-rows: 36px 16px; justify-items: center; align-items: center; color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-align: center; white-space: nowrap; }
    .modifier-control.unavailable { opacity: 0.45; }
    .modifier-control input { width: 36px; height: 36px; margin: 0; border: 1px solid var(--line-strong); border-radius: 0; appearance: none; background-color: var(--panel-alt); cursor: pointer; }
    .modifier-control input:checked { background-image: linear-gradient(var(--orange), var(--orange)); background-position: center; background-repeat: no-repeat; background-size: 18px 18px; }
    .modifier-control input:disabled { cursor: default; }
    .modifier-control input:focus-visible { outline: 2px solid var(--orange-hot); outline-offset: 2px; }
    .layout-row { min-height: 111px; padding: 0 22px; border-bottom: 1px solid var(--line); }
    .layout-row.cp-row { min-height: 104px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
    .layout-row.cp-row .grid-score.score-left,
    .layout-row.cp-row .grid-score.score-right { color: #fff; font-size: 68px; }
    .layout-row .score-buttons { gap: 30px; margin: 0; }
    .left-buttons { grid-column: 1 / 4; justify-self: end; }
    .right-buttons { grid-column: 7 / 10; justify-self: start; }
    .score-left { grid-column: 4; justify-self: end; }
    .center-label { grid-column: 5; color: var(--orange); font-family: 'Barlow Condensed', sans-serif; font-size: 25px; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
    .score-right { grid-column: 6; justify-self: start; }
    .grid-score { color: var(--orange-hot); font-family: 'Barlow Condensed', sans-serif; font-size: 45px; line-height: 1; }
    .killed-label-left { grid-area: 1 / 1; justify-self: start; color: var(--muted); font-family: inherit; font-size: inherit; letter-spacing: normal; text-align: left; white-space: nowrap; }
    .killed-count-left { grid-area: 1 / 2; justify-self: center; }
    .killed-buttons-left { grid-area: 1 / 3; justify-self: end; }
    .killed-buttons-right { grid-area: 1 / 7; justify-self: start; }
    .killed-count-right { grid-area: 1 / 8; justify-self: center; }
    .killed-label-right { grid-area: 1 / 9; justify-self: end; color: var(--muted); font-family: inherit; font-size: inherit; letter-spacing: normal; text-align: right; white-space: nowrap; }
    .tac-select-left { grid-column: 1 / 3; min-width: 0; }
    .tac-buttons-left { grid-column: 3; justify-self: end; }
    .tac-select-right { grid-column: 8 / 10; min-width: 0; }
    .tac-buttons-right { grid-column: 7; justify-self: start; }
    .primary-select-left { grid-column: 1 / 4; min-width: 0; }
    .primary-select-right { grid-column: 7 / 10; min-width: 0; }
    .initiative-choice { width: 49px; height: 49px; border: 1px solid transparent; color: var(--faint); background: transparent; font-size: 40px; line-height: 1; }
    .initiative-choice.active { color: var(--orange-hot); }
    .initiative-choice:focus-visible { border-color: var(--orange); outline: none; }
    .layout-row.totals { min-height: 119px; background: #1b1e20; }
    .layout-row.totals .credit { grid-column: 1 / 4; justify-self: start; margin: 0; color: var(--faint); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
    .layout-row.totals .credit span { color: var(--orange); }
    .layout-row.totals .total-center { grid-column: 5; border: 0; font-size: 34px; }
    .layout-row.totals .total-value { font-size: 68px; line-height: 1; }
    .layout-row.totals .action-buttons { grid-column: 7 / 10; justify-self: end; }

    @media (max-width: 760px) {
      .app-shell { padding: 14px 12px; }
      .app-header { align-items: start; gap: 12px; }
      .topline, .scores, .cp-scores, .totals { grid-template-columns: minmax(0, 1fr) 110px minmax(0, 1fr); }
      .team-panel, .score-side { padding-left: 10px; padding-right: 10px; }
      .row-labels { padding-left: 4px; padding-right: 4px; }
      select { padding-left: 8px; padding-right: 28px; font-size: 11px; }
      .counter { gap: 3px; }
      .counter-value { min-width: 25px; font-size: 42px; }
      .counter .icon-button { width: 27px; height: 27px; font-size: 16px; }
      .turning-plus.end-battle { font-size: 7px; }
      .modifier-controls { gap: 2px; }
      .modifier-control { grid-template-rows: 27px 16px; font-size: 8px; letter-spacing: 0.02em; }
      .modifier-control input { width: 27px; height: 27px; }
      .score-stepper { gap: 3px; }
      .score-number { min-width: 30px; font-size: 36px; }
      .score-buttons .icon-button { width: 25px; height: 25px; font-size: 13px; }
      .layout-row .score-buttons { gap: 20px; }
      .score-row { padding-left: 7px; padding-right: 5px; }
      .total-side { padding-left: 10px; padding-right: 10px; }
      .total-label { font-size: 8px; }
      .total-value { font-size: 35px; }
      .score-layout { --layout-columns: minmax(0, 1fr) 26px minmax(26px, .45fr) 34px 58px 34px minmax(26px, .45fr) 26px minmax(0, 1fr); }
      .setup-grid { grid-template-rows: 64px 42px 54px; padding-left: 10px; padding-right: 10px; }
      .layout-row { min-height: 64px; padding-left: 10px; padding-right: 10px; }
      .layout-row.cp-row { min-height: 70px; }
      .layout-row.cp-row .grid-score { font-size: 46px; }
      .grid-score { font-size: 34px; }
      .center-label { font-size: 16px; }
      .killed-label-left, .killed-label-right { display: none; }
      .layout-row.totals { min-height: 78px; }
      .layout-row.totals .total-center { font-size: 21px; }
      .layout-row.totals .total-value { font-size: 46px; }
      .action-buttons { gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="scorecard score-layout" aria-label="Kill Team scorecard">
      <div class="setup-grid">
        <select id="left-team" class="team-left" data-player="left" aria-label="Left Kill Team"></select>
        <select id="right-team" class="team-right" data-player="right" aria-label="Right Kill Team"></select>
        <select id="left-operatives" class="operatives-left" data-player="left" aria-label="Left Starting Non-Expendable Operatives"></select>
        <select id="right-operatives" class="operatives-right" data-player="right" aria-label="Right Starting Non-Expendable Operatives"></select>
        <div class="modifier-controls modifier-controls-left" data-player="left">
          <label class="modifier-control"><input type="checkbox" data-modifier="reroll" aria-label="Left Re-Roll"><span>Re-Roll</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="one" data-unlocks-at="1" aria-label="Left plus or minus 1"><span>-/+ 1</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="two" data-unlocks-at="2" aria-label="Left plus or minus 2"><span>-/+ 2</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="three" data-unlocks-at="3" aria-label="Left plus or minus 3"><span>-/+ 3</span></label>
        </div>
        <div class="modifier-controls modifier-controls-right" data-player="right">
          <label class="modifier-control"><input type="checkbox" data-modifier="three" data-unlocks-at="3" aria-label="Right plus or minus 3"><span>-/+ 3</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="two" data-unlocks-at="2" aria-label="Right plus or minus 2"><span>-/+ 2</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="one" data-unlocks-at="1" aria-label="Right plus or minus 1"><span>-/+ 1</span></label>
          <label class="modifier-control"><input type="checkbox" data-modifier="reroll" aria-label="Right Re-Roll"><span>Re-Roll</span></label>
        </div>
        <button class="initiative-choice initiative-left active" type="button" data-initiative="left" aria-label="Left player has initiative">◀</button>
        <span class="initiative-label">Initiative</span>
        <button class="initiative-choice initiative-right" type="button" data-initiative="right" aria-label="Right player has initiative">▶</button>
        <span class="turning-label">Turning Point</span>
        <button class="icon-button turning-minus" type="button" data-counter="turningPoint" data-change="-1" aria-label="Decrease turning point">−</button>
        <output id="turning-point-value" class="counter-value turning-value">0</output>
        <button class="icon-button turning-plus" type="button" data-counter="turningPoint" data-change="1" aria-label="Increase turning point">+</button>
      </div>

      <div class="layout-row cp-row" data-side="left">
        <div class="score-buttons left-buttons"><button class="icon-button" type="button" data-score-change="cp" data-change="-1" aria-label="Decrease left CP">−</button><button class="icon-button" type="button" data-score-change="cp" data-change="1" aria-label="Increase left CP">+</button></div>
        <output class="grid-score score-left" data-player="left" data-score="cp">0</output><span class="center-label">CP</span><output class="grid-score score-right" data-player="right" data-score="cp">0</output>
        <div class="score-buttons right-buttons" data-side="right"><button class="icon-button" type="button" data-score-change="cp" data-change="1" aria-label="Increase right CP">+</button><button class="icon-button" type="button" data-score-change="cp" data-change="-1" aria-label="Decrease right CP">−</button></div>
      </div>

      <div class="layout-row" data-side="left">
        <div class="score-buttons left-buttons"><button class="icon-button" type="button" data-score-change="crit" data-change="-1" aria-label="Decrease left Crit Op">−</button><button class="icon-button" type="button" data-score-change="crit" data-change="1" aria-label="Increase left Crit Op">+</button></div>
        <output class="grid-score score-left" data-player="left" data-score="crit">0</output><span class="center-label">Crit Op</span><output class="grid-score score-right" data-player="right" data-score="crit">0</output>
        <div class="score-buttons right-buttons" data-side="right"><button class="icon-button" type="button" data-score-change="crit" data-change="1" aria-label="Increase right Crit Op">+</button><button class="icon-button" type="button" data-score-change="crit" data-change="-1" aria-label="Decrease right Crit Op">−</button></div>
      </div>

      <div class="layout-row" data-side="left">
        <span class="killed-label-left">Operatives Remaining</span><div class="score-buttons killed-buttons-left" data-side="left"><button class="icon-button" type="button" data-score-change="remaining" data-change="-1" aria-label="Decrease left operatives remaining">−</button><button class="icon-button" type="button" data-score-change="remaining" data-change="1" aria-label="Increase left operatives remaining">+</button></div><output class="grid-score killed-count-left" data-player="left" data-score="remaining">0</output>
        <output class="grid-score score-left" data-player="left" data-score="kill">0</output><span class="center-label">Kill Op</span><output class="grid-score score-right" data-player="right" data-score="kill">0</output>
        <output class="grid-score killed-count-right" data-player="right" data-score="remaining">0</output><div class="score-buttons killed-buttons-right" data-side="right"><button class="icon-button" type="button" data-score-change="remaining" data-change="1" aria-label="Increase right operatives remaining">+</button><button class="icon-button" type="button" data-score-change="remaining" data-change="-1" aria-label="Decrease right operatives remaining">−</button></div><span class="killed-label-right">Operatives Remaining</span>
      </div>

      <div class="layout-row">
        <select class="tac-select-left" data-op="tac" data-player="left" aria-label="Left Tac Op"></select><div class="score-buttons tac-buttons-left" data-side="left"><button class="icon-button" type="button" data-score-change="tac" data-change="-1" aria-label="Decrease left Tac Op">−</button><button class="icon-button" type="button" data-score-change="tac" data-change="1" aria-label="Increase left Tac Op">+</button></div>
        <output class="grid-score score-left" data-player="left" data-score="tac">0</output><span class="center-label">Tac Op</span><output class="grid-score score-right" data-player="right" data-score="tac">0</output>
        <div class="score-buttons tac-buttons-right" data-side="right"><button class="icon-button" type="button" data-score-change="tac" data-change="1" aria-label="Increase right Tac Op">+</button><button class="icon-button" type="button" data-score-change="tac" data-change="-1" aria-label="Decrease right Tac Op">−</button></div><select class="tac-select-right" data-op="tac" data-player="right" aria-label="Right Tac Op"></select>
      </div>

      <div class="layout-row">
        <select class="primary-operation primary-select-left" data-op="primary" data-player="left" aria-label="Left Primary Op"><option value="">Reveal Primary Op</option><option value="crit">Crit Op</option><option value="kill">Kill Op</option><option value="tac">Tac Op</option></select><select class="primary-operation primary-select-right" data-op="primary" data-player="right" aria-label="Right Primary Op"><option value="">Reveal Primary Op</option><option value="crit">Crit Op</option><option value="kill">Kill Op</option><option value="tac">Tac Op</option></select>
      </div>

      <div class="layout-row totals">
        <p class="credit">Made by <span>Shawn the Lugger</span></p>
        <output class="total-value score-left" data-total="left">0</output><span class="total-center">Total VP</span><output class="total-value score-right" data-total="right">0</output>
        <div class="action-buttons"><button id="new-game" class="reset-button" type="button">New game</button><button id="reset-game" class="reset-button" type="button">Reset game</button></div>
      </div>
    </section>

    <p id="error-message" class="error-message" role="alert"></p>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const state = {
      turningPoint: 0,
      battleEnded: false,
      initiative: 'left',
      left: { team: '', startingOperatives: '', operativesRemaining: 0, modifiers: { reroll: false, one: false, two: false, three: false }, scores: { cp: 3, crit: 0, tac: 0 }, tacOp: '', primary: '' },
      right: { team: '', startingOperatives: '', operativesRemaining: 0, modifiers: { reroll: false, one: false, two: false, three: false }, scores: { cp: 3, crit: 0, tac: 0 }, tacOp: '', primary: '' }
    };
    let teamOptions = [];
    let tacOps = [];
    let killGrades = {};
    let startingKillGrades = {};
    const sync = { peer: null, host: false, connections: [], connection: null };
    const params = new URLSearchParams(window.location.search);
    const createGameId = () => `match-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    const gameName = params.get('game') || createGameId();
    const roomSlug = gameName.toLowerCase().replace(/[^a-z0-9-]/g, '-').slice(0, 18) || 'main';
    const roomHash = [...gameName].reduce((hash, character) => ((hash * 31) + character.charCodeAt(0)) >>> 0, 7).toString(36);
    const roomKey = `${roomSlug}-${roomHash}`;
    const hostPeerId = `kill-team-scorecard-${roomKey}`;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    function showError(message) {
      const error = $('#error-message');
      error.textContent = message;
      error.classList.add('visible');
    }

    function populateTeamOptions() {
      $$('[data-player][id$="-team"]').forEach((select) => {
        select.innerHTML = '<option value="">Select Kill Team</option>' + teamOptions.map((team) => `<option value="${escapeHtml(team.name)}">${escapeHtml(team.name)}</option>`).join('');
      });
    }

    function populateStartingOperatives(player) {
      const select = $(`#${player}-operatives`);
      const team = state[player].team;
      const options = team && startingKillGrades[team] ? startingKillGrades[team] : [];

      if (!team || options.length === 0) {
        select.innerHTML = '<option value="">Starting Non-Expendable Operatives</option>';
        select.value = '';
        select.classList.add('operatives-hidden');
        state[player].startingOperatives = '';
      } else if (options.length === 1) {
        select.innerHTML = `<option value="${options[0]}">${options[0]}</option>`;
        select.value = String(options[0]);
        select.classList.add('operatives-hidden');
        state[player].startingOperatives = options[0];
      } else {
        select.innerHTML = '<option value="">Starting Non-Expendable Operatives</option>' + options.map((value) => `<option value="${value}">${value}</option>`).join('');
        if (state[player].startingOperatives !== '' && !options.includes(Number(state[player].startingOperatives))) {
          state[player].startingOperatives = '';
        }
        select.value = String(state[player].startingOperatives);
        select.classList.remove('operatives-hidden');
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }

    const urlKeys = {
      turningPoint: 'tp',
      battleEnded: 'battleEnded',
      initiative: 'initiative',
      left: { team: 'leftTeam', operativesRemaining: 'leftRemaining', kill: 'leftKill', cp: 'leftCp', crit: 'leftCrit', tac: 'leftTac', total: 'leftTotal', tacOp: 'leftTacOp', primary: 'leftPrimary' },
      right: { team: 'rightTeam', operativesRemaining: 'rightRemaining', kill: 'rightKill', cp: 'rightCp', crit: 'rightCrit', tac: 'rightTac', total: 'rightTotal', tacOp: 'rightTacOp', primary: 'rightPrimary' }
    };

    function copyState() {
      return JSON.parse(JSON.stringify(state));
    }

    function sendState(connection, type = 'state') {
      if (connection && connection.open) connection.send({ type, state: copyState() });
    }

    function broadcastState() {
      if (sync.host) sync.connections.forEach((connection) => sendState(connection));
      else sendState(sync.connection, 'state-update');
    }

    function applyRemoteState(nextState) {
      if (!nextState || !nextState.left || !nextState.right) return;
      Object.assign(state, nextState);
      ['left', 'right'].forEach((player) => {
        state[player].modifiers = state[player].modifiers || { reroll: false, one: false, two: false, three: false };
      });
      render(false);
    }

    function handleConnection(connection) {
      connection.on('open', () => {
        if (sync.host) {
          sync.connections.push(connection);
          sendState(connection);
        } else {
          sync.connection = connection;
          connection.send({ type: 'request-state' });
        }
      });
      connection.on('data', (message) => {
        if (message.type === 'request-state' && sync.host) sendState(connection);
        if (message.type === 'state-update' && sync.host) { applyRemoteState(message.state); broadcastState(); }
        if (message.type === 'state' && !sync.host) applyRemoteState(message.state);
      });
      connection.on('close', () => {
        sync.connections = sync.connections.filter((item) => item !== connection);
        if (sync.connection === connection) sync.connection = null;
      });
    }

    function initializeSync() {
      if (!window.Peer) return;
      const hostPeer = new Peer(hostPeerId);
      hostPeer.on('open', () => {
        sync.peer = hostPeer;
        sync.host = true;
        hostPeer.on('connection', handleConnection);
      });
      hostPeer.on('error', (error) => {
        if (error.type !== 'unavailable-id') return;
        hostPeer.destroy();
        const clientPeer = new Peer();
        clientPeer.on('open', () => {
          sync.peer = clientPeer;
          handleConnection(clientPeer.connect(hostPeerId));
        });
      });
    }

    function readUrlState() {
      const params = new URLSearchParams(window.location.search);
      if (!window.location.search) return;
      const legacyBattleEnded = Number(params.get(urlKeys.turningPoint)) >= 5;
      state.turningPoint = Math.max(0, Math.min(4, Number(params.get(urlKeys.turningPoint)) || 0));
      state.battleEnded = legacyBattleEnded || params.get(urlKeys.battleEnded) === 'true';
      state.initiative = params.get(urlKeys.initiative) === 'right' ? 'right' : 'left';
      ['left', 'right'].forEach((player) => {
        const keys = urlKeys[player];
        state[player].team = params.get(keys.team) || '';
        const options = state[player].team && startingKillGrades[state[player].team] ? startingKillGrades[state[player].team] : [];
        state[player].startingOperatives = options.length === 1 ? options[0] : '';
        state[player].operativesRemaining = params.has(keys.operativesRemaining) ? Math.max(0, Number(params.get(keys.operativesRemaining)) || 0) : (Number(state[player].startingOperatives) || 0);
        state[player].scores.cp = params.has(keys.cp) ? Math.max(0, Math.min(12, Number(params.get(keys.cp)) || 0)) : 3;
        state[player].scores.crit = Math.max(0, Math.min(6, Number(params.get(keys.crit)) || 0));
        state[player].scores.tac = Math.max(0, Math.min(6, Number(params.get(keys.tac)) || 0));
        state[player].tacOp = params.get(keys.tacOp) || '';
        state[player].primary = params.get(keys.primary) || '';
      });
    }

    function writeUrlState() {
      const params = new URLSearchParams();
      params.set('game', gameName);
      params.set(urlKeys.turningPoint, state.turningPoint);
      if (state.battleEnded) params.set(urlKeys.battleEnded, 'true');
      params.set(urlKeys.initiative, state.initiative);
      ['left', 'right'].forEach((player) => {
        const keys = urlKeys[player];
        if (state[player].team) params.set(keys.team, state[player].team);
        params.set(keys.operativesRemaining, state[player].operativesRemaining);
        params.set(keys.kill, killOpScore(player));
        params.set(keys.cp, state[player].scores.cp);
        params.set(keys.crit, state[player].scores.crit);
        params.set(keys.tac, state[player].scores.tac);
        params.set(keys.total, calculateTotal(player));
        if (state[player].tacOp) params.set(keys.tacOp, state[player].tacOp);
        if (state[player].primary) params.set(keys.primary, state[player].primary);
      });
      window.history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
    }

    function availableTacOps(player) {
      const selectedTeam = teamOptions.find((team) => team.name === state[player].team);
      if (!selectedTeam) return [];
      return tacOps.filter((op) => selectedTeam.archetypes.includes(op.archetype));
    }

    function populateTacOp(player) {
      const select = $(`[data-op="tac"][data-player="${player}"]`);
      const options = availableTacOps(player);
      const current = state[player].tacOp;
      select.innerHTML = '<option value="">Reveal Tac Op</option>' + options.map((op) => `<option value="${escapeHtml(op.name)}" data-archetype="${escapeHtml(op.archetype)}">${escapeHtml(op.name)}</option>`).join('');
      state[player].tacOp = options.some((op) => op.name === current) ? current : '';
      select.value = state[player].tacOp;
    }

    function rawKillOpScore(player) {
      const opposingPlayer = player === 'left' ? 'right' : 'left';
      const thresholds = killGrades[String(state[opposingPlayer].startingOperatives)] || [];
      const opposingOperativesKilled = Math.max(0, Number(state[opposingPlayer].startingOperatives) - Number(state[opposingPlayer].operativesRemaining));
      return thresholds.reduce((score, threshold, index) => opposingOperativesKilled >= threshold ? index + 1 : score, 0);
    }

    function killOpScore(player) {
      const otherPlayer = player === 'left' ? 'right' : 'left';
      const rawScore = rawKillOpScore(player);
      const bonus = state.battleEnded && rawScore > rawKillOpScore(otherPlayer) ? 1 : 0;
      return Math.min(6, rawScore + bonus);
    }

    function calculateTotal(player) {
      const scores = state[player].scores;
      const selectedOperation = state[player].primary;
      const selectedScore = selectedOperation ? (selectedOperation === 'kill' ? killOpScore(player) : selectedOperation === 'tac' ? scores.tac : scores.crit) : 0;
      return scores.crit + killOpScore(player) + scores.tac + Math.ceil(selectedScore / 2);
    }

    function render(share = true) {
      $('#turning-point-value').textContent = state.turningPoint;
      const turningPlus = $('.turning-plus');
      const isFinalTurningPoint = state.turningPoint === 4;
      turningPlus.textContent = isFinalTurningPoint ? 'END' : '+';
      turningPlus.setAttribute('aria-label', isFinalTurningPoint ? 'End battle' : 'Increase turning point');
      turningPlus.classList.toggle('end-battle', isFinalTurningPoint);
      turningPlus.disabled = state.battleEnded;
      $$('[data-initiative]').forEach((button) => button.classList.toggle('active', button.dataset.initiative === state.initiative));
      ['left', 'right'].forEach((player) => {
        $(`#${player}-team`).value = state[player].team;
        populateStartingOperatives(player);
        $$(`[data-player="${player}"] [data-modifier]`).forEach((input) => {
          const unavailable = Number(input.dataset.unlocksAt) > state.turningPoint;
          input.disabled = unavailable;
          input.closest('.modifier-control').classList.toggle('unavailable', unavailable);
          input.checked = state[player].modifiers[input.dataset.modifier];
        });
        Object.entries(state[player].scores).filter(([score]) => score !== 'cp').forEach(([score, value]) => { $(`[data-score="${score}"][data-player="${player}"]`).textContent = score === 'kill' ? killOpScore(player) : value; });
        $(`[data-score="kill"][data-player="${player}"]`).textContent = killOpScore(player);
        $(`[data-score="remaining"][data-player="${player}"]`).textContent = state[player].operativesRemaining;
        $(`[data-score="cp"][data-player="${player}"]`).textContent = state[player].scores.cp;
        $(`[data-total="${player}"]`).textContent = calculateTotal(player);
        $(`[data-op="primary"][data-player="${player}"]`).value = state[player].primary;
        $(`[data-op="primary"][data-player="${player}"]`).disabled = !state.battleEnded;
        $(`[data-op="primary"][data-player="${player}"]`).setAttribute('aria-hidden', String(!state.battleEnded));
        populateTacOp(player);
      });
      const leftTotal = calculateTotal('left');
      const rightTotal = calculateTotal('right');
      const revealWinner = state.battleEnded;
      $('[data-total="left"]').classList.toggle('winner', revealWinner && leftTotal >= rightTotal);
      $('[data-total="right"]').classList.toggle('winner', revealWinner && rightTotal >= leftTotal);
      writeUrlState();
      if (share) broadcastState();
    }

    function setTeam(player, team) {
      state[player].team = team;
      state[player].tacOp = '';
      const options = team && startingKillGrades[team] ? startingKillGrades[team] : [];
      state[player].startingOperatives = options.length === 1 ? options[0] : '';
      state[player].operativesRemaining = Number(state[player].startingOperatives) || 0;
      populateTacOp(player);
      render();
    }

    function resetGame() {
      if (!window.confirm('Reset both players and clear the current scorecard?')) return;
      state.turningPoint = 0;
      state.battleEnded = false;
      state.initiative = 'left';
      ['left', 'right'].forEach((player) => { state[player].team = ''; state[player].startingOperatives = ''; state[player].operativesRemaining = 0; state[player].tacOp = ''; state[player].primary = ''; Object.keys(state[player].modifiers).forEach((modifier) => { state[player].modifiers[modifier] = false; }); Object.keys(state[player].scores).forEach((score) => { state[player].scores[score] = score === 'cp' ? 3 : 0; }); });
      render();
    }

    function createNewRoom() {
      const newGame = createGameId();
      window.location.href = `${window.location.pathname}?game=${encodeURIComponent(newGame)}`;
    }

    async function initialize() {
      try {
        const [teamsResponse, tacOpsResponse, killGradesResponse, startingGradesResponse] = await Promise.all([
          fetch('data/kill-teams.json'),
          fetch('data/tac-ops.json'),
          fetch('data/kill-grade.json'),
          fetch('data/starting-kill-grade.json')
        ]);
        if (!teamsResponse.ok || !tacOpsResponse.ok || !killGradesResponse.ok || !startingGradesResponse.ok) throw new Error('Data files could not be loaded.');
        teamOptions = await teamsResponse.json();
        tacOps = await tacOpsResponse.json();
        killGrades = await killGradesResponse.json();
        startingKillGrades = await startingGradesResponse.json();
        populateTeamOptions();
        ['left', 'right'].forEach((player) => populateStartingOperatives(player));
        readUrlState();
        render();
        initializeSync();
      } catch (error) {
        showError('The scorecard data could not be loaded. Run this site through a local web server or GitHub Pages.');
        console.error(error);
      }
    }

    document.addEventListener('click', (event) => {
      const counterButton = event.target.closest('[data-counter]');
      if (counterButton) {
        if (counterButton.dataset.counter === 'turningPoint' && state.turningPoint === 4 && Number(counterButton.dataset.change) > 0) {
          state.battleEnded = true;
        } else {
          state[counterButton.dataset.counter] = Math.max(0, Math.min(4, state[counterButton.dataset.counter] + Number(counterButton.dataset.change)));
          if (counterButton.dataset.counter === 'turningPoint') state.battleEnded = false;
        }
      }
      const scoreButton = event.target.closest('[data-score-change]');
      if (scoreButton) { const side = scoreButton.closest('[data-side]').dataset.side; const score = scoreButton.dataset.scoreChange; if (score === 'remaining') { const maximum = Number(state[side].startingOperatives) || 0; state[side].operativesRemaining = Math.max(0, Math.min(maximum, state[side].operativesRemaining + Number(scoreButton.dataset.change))); } else { const maximum = score === 'cp' ? 12 : 6; state[side].scores[score] = Math.max(0, Math.min(maximum, state[side].scores[score] + Number(scoreButton.dataset.change))); } }
      const initiativeButton = event.target.closest('[data-initiative]');
      if (initiativeButton) state.initiative = initiativeButton.dataset.initiative;
      if (counterButton || scoreButton || initiativeButton) render();
    });

    document.addEventListener('change', (event) => {
      const teamSelect = event.target.closest('[id$="-team"]');
      if (teamSelect) setTeam(teamSelect.dataset.player, teamSelect.value);
      const operativesSelect = event.target.closest('[id$="-operatives"]');
      if (operativesSelect) { const player = operativesSelect.dataset.player; state[player].startingOperatives = operativesSelect.value ? Number(operativesSelect.value) : ''; state[player].operativesRemaining = Number(state[player].startingOperatives) || 0; render(); }
      const modifier = event.target.closest('[data-modifier]');
      if (modifier) { const player = modifier.closest('[data-player]').dataset.player; state[player].modifiers[modifier.dataset.modifier] = modifier.checked; render(); }
      const opSelect = event.target.closest('[data-op]');
      if (opSelect && opSelect.dataset.op === 'tac') state[opSelect.dataset.player].tacOp = opSelect.value;
      if (opSelect && opSelect.dataset.op === 'primary') state[opSelect.dataset.player].primary = opSelect.value;
      if (opSelect) render();
    });

    $('#reset-game').addEventListener('click', resetGame);
    $('#new-game').addEventListener('click', createNewRoom);
    document.addEventListener('gesturestart', (event) => event.preventDefault());
    initialize();
  </script>
</body>
</html>
